name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # Install dependencies and update package-lock.json if necessary
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Confirm Gemini SDK is installed
      - name: Verify Gemini SDK
        run: npm list @google/genai

      # Build the React/Vite application
      - name: Build Web App
        run: npm run build

      # Install Capacitor Android if needed
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      # Create Android project if it does not already exist
      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      # Build APK
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mend-my-ux-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
